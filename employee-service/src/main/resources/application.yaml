server:
  port: 8081

spring:
  application:
    name: employee-service

  datasource:
    url: jdbc:mysql://localhost:3306/employee_service_db
    username: root
    password: Kalyan@18

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true

  cloud:
    openfeign:
      client:
        config:
          USER-SERVICE:
            connectTimeout: 2000
            readTimeout: 3000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

resilience4j:
  circuitbreaker:
    instances:
      userService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

  retry:
    instances:
      userService:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - feign.RetryableException
          - java.io.IOException